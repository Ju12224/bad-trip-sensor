# XcodeGen spec: the cloud build turns this into an Xcode project (there is no Mac here to make one by hand).
name: BadTrip
options:
  bundleIdPrefix: com.ju12224
  deploymentTarget:
    iOS: "16.0"
targets:
  BadTrip:
    type: application
    platform: iOS
    sources: [BadTrip]
    scheme: {}
    info:
      path: BadTrip/Info.plist
      properties:
        CFBundleDisplayName: Bad Trip
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Bad Trip reads your pulse through your fingertip on the back camera.
        NSMotionUsageDescription: Bad Trip uses the phone's motion for tilt controls and to know when you're holding still.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ju12224.badtrip
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
